<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Borrar Album - Music Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
    <h1>Borrar Album</h1>
    <h2 class="h4">¿Está seguro de que quiere eliminarlo?</h2>
    <h2 class="h5">Album</h2>
    <hr>

    <dl class="row">
        <dt class="col-sm-2">Título</dt>
        <dd class="col-sm-10" th:text="${album.title}"></dd>
        <dt class="col-sm-2">Artista</dt>
        <dd class="col-sm-10" th:text="${album.artist.name}"></dd>
    </dl>

    <form th:action="@{/albums/{id}/delete(id=${album.albumId})}" method="post" class="d-inline">
        <button type="submit" class="btn btn-danger">Borrar</button>
    </form>
    | <a th:href="@{/albums}">Volver al listado</a>
</main>
</body>
</html>
