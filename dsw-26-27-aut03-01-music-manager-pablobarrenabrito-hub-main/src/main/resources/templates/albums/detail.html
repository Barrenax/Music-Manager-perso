<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalles del Album - Music Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
    <h1>Detalles del Album</h1>
    <h2 class="h4">Album</h2>
    <hr>

    <dl class="row">
        <dt class="col-sm-2">Título</dt>
        <dd class="col-sm-10" th:text="${album.title}"></dd>
        <dt class="col-sm-2">Artista</dt>
        <dd class="col-sm-10" th:text="${album.artist.name}"></dd>
    </dl>

    <h2 class="h3 mt-4">Listado de canciones del album:</h2>
    <table class="table" th:if="${!album.tracks.empty}">
        <thead>
        <tr>
            <th>#</th>
            <th>Título</th>
            <th>Compositor</th>
            <th>Duración</th>
            <th class="text-end">Precio</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="track, stat : ${album.tracks}">
            <td th:text="${stat.count}"></td>
            <td th:text="${track.name}"></td>
            <td th:text="${track.composer} ?: '—'"></td>
            <td th:text="${track.formattedDuration}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(track.unitPrice, 1, 2)}"></td>
        </tr>
        </tbody>
    </table>
    <p class="text-muted" th:if="${album.tracks.empty}">Este disco no tiene canciones.</p>

    <p>
        <a th:href="@{/albums/{id}/edit(id=${album.albumId})}">Editar</a> |
        <a th:href="@{/albums}">Volver al listado</a>
    </p>
</main>
</body>
</html>
