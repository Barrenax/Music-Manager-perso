<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discos - Music Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
    <h1>Listado de Albums</h1>

    <p><a th:href="@{/albums/new}">Crear nuevo album</a></p>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table">
        <thead>
        <tr>
            <th>Título</th>
            <th>Artista</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="album : ${albums.content}">
            <td th:text="${album.title}"></td>
            <td th:text="${album.artist.name}"></td>
            <td class="text-end">
                <a th:href="@{/albums/{id}/edit(id=${album.albumId})}">Editar</a> |
                <a th:href="@{/albums/{id}(id=${album.albumId})}">Detalles</a> |
                <a th:href="@{/albums/{id}/delete(id=${album.albumId})}">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${albums.empty}">
            <td colspan="3" class="text-center text-muted">No hay discos.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${albums.totalPages > 1}" aria-label="Paginación de discos">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${albums.first} ? 'disabled'">
                <a class="page-link" th:href="@{/albums(page=${albums.number - 1})}">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="'Página ' + ${albums.number + 1} + ' de ' + ${albums.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${albums.last} ? 'disabled'">
                <a class="page-link" th:href="@{/albums(page=${albums.number + 1})}">Siguiente</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
