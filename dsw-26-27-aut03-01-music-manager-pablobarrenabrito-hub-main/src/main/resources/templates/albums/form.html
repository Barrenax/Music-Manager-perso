<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Album - Music Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
    <h1 th:text="${formTitle}">Album</h1>
    <h2 class="h4">Album</h2>
    <hr>

    <form th:action="@{${formAction}}" th:object="${album}" method="post" novalidate>
        <div class="row">
            <div class="col-md-5">
                <div class="mb-2">
                    <label for="title" class="form-label mb-0">Título</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="mb-2">
                    <label for="artist" class="form-label mb-0">Artista</label>
                    <select id="artist" th:field="*{artist.artistId}" class="form-select"
                            th:classappend="${#fields.hasErrors('artist')} ? 'is-invalid'">
                        <option value="">-- Selecciona un artista --</option>
                        <option th:each="a : ${artists}" th:value="${a.artistId}" th:text="${a.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{artist}"></div>
                </div>

                <button type="submit" class="btn btn-primary" th:text="${submitLabel}">Guardar</button>
                <div class="mt-2"><a th:href="@{/albums}">Volver al listado</a></div>
            </div>
        </div>
    </form>
</main>
</body>
</html>
