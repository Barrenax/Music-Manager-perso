<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear Comentario - Music Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
  <h1>Crear</h1>
  <h2 class="h4">Comentario</h2>
  <hr>

  <form th:action="@{/artists/{id}/reviews/new(id=${artist.artistId})}" th:object="${review}" method="post" novalidate>
    <div class="row">
      <div class="col-md-5">
        <div class="mb-2">
          <label for="title" class="form-label mb-0">Título</label>
          <input type="text" id="title" th:field="*{title}" class="form-control"
                 th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>

        <div class="mb-2">
          <label for="description" class="form-label mb-0">Comentario</label>
          <input type="text" id="description" th:field="*{description}" class="form-control"
                 th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <div class="mb-2">
          <label for="rating" class="form-label mb-0">Valoración</label>
          <input type="number" id="rating" th:field="*{rating}" min="1" max="5" class="form-control"
                 th:classappend="${#fields.hasErrors('rating')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{rating}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Comentar</button>
        <div class="mt-2">
          <a th:href="@{/artists/{id}(id=${artist.artistId})}">Volver al Artista</a>
        </div>
      </div>
    </div>
  </form>
</main>
</body>
</html>
