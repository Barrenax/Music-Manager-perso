<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Album - Music Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
    <h1>Crear Album</h1>
    <h2 class="h4">Artista: <span th:text="${artist.name}"></span></h2>
    <hr>

    <form th:action="@{/artists/{id}/albums/new(id=${artist.artistId})}" th:object="${album}" method="post" novalidate>
        <div class="row">
            <div class="col-md-5">
                <div class="mb-2">
                    <label for="title" class="form-label mb-0">Título</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <button type="submit" class="btn btn-primary">Crear</button>
                <div class="mt-2">
                    <a th:href="@{/artists/{id}/albums(id=${artist.artistId})}">Volver a los discos del artista</a>
                </div>
            </div>
        </div>
    </form>
</main>
</body>
</html>
