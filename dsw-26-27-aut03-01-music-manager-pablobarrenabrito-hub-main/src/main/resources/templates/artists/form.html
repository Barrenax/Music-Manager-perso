<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artista - Music Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
    <h1 th:text="${formTitle}">Artista</h1>
    <h2 class="h4">Artista</h2>
    <hr>

    <form th:action="@{${formAction}}" th:object="${artist}" method="post" novalidate>
        <div class="row">
            <div class="col-md-5">
                <div class="mb-2">
                    <label for="name" class="form-label mb-0">Nombre</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <button type="submit" class="btn btn-primary" th:text="${submitLabel}">Guardar</button>
                <div class="mt-2"><a th:href="@{/artists}">Volver al listado</a></div>
            </div>
        </div>
    </form>
</main>
</body>
</html>
