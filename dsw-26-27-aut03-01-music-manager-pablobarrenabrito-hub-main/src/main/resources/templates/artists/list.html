<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de Artistas - Music Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
    <h1>Listado de Artistas</h1>

    <p><a th:href="@{/artists/new}">Crear nuevo artista</a></p>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table">
        <thead>
        <tr>
            <th>Nombre</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="artist : ${artists.content}">
            <td th:text="${artist.name}"></td>
            <td>
                <a th:href="@{/artists/{id}/edit(id=${artist.artistId})}">Editar</a> |
                <a th:href="@{/artists/{id}(id=${artist.artistId})}">Detalles</a> |
                <a th:href="@{/artists/{id}/delete(id=${artist.artistId})}">Borrar</a> |
                <a th:href="@{/artists/{id}/albums(id=${artist.artistId})}">Discos del artista</a>
            </td>
        </tr>
        <tr th:if="${artists.empty}">
            <td colspan="2" class="text-center text-muted">No hay artistas.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${artists.totalPages > 1}" aria-label="Paginación de artistas">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${artists.first} ? 'disabled'">
                <a class="page-link" th:href="@{/artists(page=${artists.number - 1})}">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="'Página ' + ${artists.number + 1} + ' de ' + ${artists.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${artists.last} ? 'disabled'">
                <a class="page-link" th:href="@{/artists(page=${artists.number + 1})}">Siguiente</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
