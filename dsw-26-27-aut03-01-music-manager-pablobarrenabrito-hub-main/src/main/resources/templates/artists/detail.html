<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalles del Artista - Music Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
  <h1>Detalles del Artista</h1>
  <h2 class="h4">Artista</h2>
  <hr>

  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

  <dl class="row">
    <dt class="col-sm-2">Nombre</dt>
    <dd class="col-sm-10" th:text="${artist.name}"></dd>
  </dl>

  <h2 class="h3 d-inline-block">Comentarios</h2>
  <a class="btn btn-success btn-sm ms-2 align-baseline"
     th:href="@{/artists/{id}/reviews/new(id=${artist.artistId})}">Nuevo</a>

  <div class="list-group list-group-flush mt-3 mb-3" th:if="${!reviews.empty}">
    <div class="list-group-item" th:each="r : ${reviews}">
      <div class="row">
        <div class="col-md-3">
          <strong th:text="${r.title}"></strong><br>
          <span th:text="${r.description}"></span>
        </div>
        <div class="col-md-9" style="color: #fd7e14">
          <span th:each="n : ${#numbers.sequence(1, 5)}" th:text="${r.rating >= n} ? '★' : '☆'"></span>
        </div>
      </div>
    </div>
  </div>

  <p class="mt-3">
    <a th:href="@{/artists/{id}/edit(id=${artist.artistId})}">Editar</a> |
    <a th:href="@{/artists}">Volver al listado</a>
  </p>
</main>
</body>
</html>
