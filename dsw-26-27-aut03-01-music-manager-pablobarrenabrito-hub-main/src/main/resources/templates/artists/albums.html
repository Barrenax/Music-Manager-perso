<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Albums del Artista - Music Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
    <h1>Albums del Artista</h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <p><a th:href="@{/artists/{id}/albums/new(id=${artist.artistId})}">Nuevo disco</a></p>

    <ul>
        <li th:each="album : ${artist.albums}" th:text="${album.title}"></li>
    </ul>
    <p class="text-muted" th:if="${artist.albums.empty}">Este artista no tiene discos.</p>

    <p><a th:href="@{/artists}">Volver al listado de artistas</a></p>
</main>
</body>
</html>
