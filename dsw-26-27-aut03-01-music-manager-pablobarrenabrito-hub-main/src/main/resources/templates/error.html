<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error - Music Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>

<main class="container">
    <h1>Algo ha salido mal</h1>
    <h2 class="h4">Error <span th:text="${status}">500</span></h2>
    <hr>
    <p>Ha ocurrido un error inesperado. Inténtalo de nuevo más tarde.</p>
    <a th:href="@{/}">Volver al inicio</a>
</main>
</body>
</html>
